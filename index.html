<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qui est qui ?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #e9edf1; --panel: #ffffff; --ink: #1b2430; --muted: #5d6b7b;
  --line: #cdd5de; --accent: #1f4e8c; --accent-ink: #ffffff; --hit: #f2c230;
  --display: "Archivo Black", "Arial Black", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121820; --panel: #1b232e; --ink: #e8edf3; --muted: #93a1b2; --line: #2c3746;
  --accent: #6f9fe0; --accent-ink: #0d1520; --hit: #e0b22a; color-scheme: dark } }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 32px; }
h1 { font: 2.4rem/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font: 1.3rem/1.2 var(--display); margin: 0; }
.eyebrow { font: 500 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.status { font: 500 .8rem var(--mono); color: var(--muted); }
section { display: grid; gap: 12px; }
.step { display: flex; align-items: baseline; gap: 10px; }
.step .num { font: 500 .8rem var(--mono); color: var(--accent-ink); background: var(--accent); border-radius: 99px; width: 1.6rem; height: 1.6rem; display: inline-grid; place-items: center; flex: none; }

.licences { display: flex; flex-wrap: wrap; gap: 8px; }
.lic { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
.lic img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--line); }
.lic small { font: 500 .72rem var(--mono); color: var(--muted); font-weight: 500; }
.lic[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lic[aria-pressed="true"] small { color: inherit; opacity: .8; }
.lic:focus-visible, .badge:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.badge { all: unset; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; }
.badge[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.badge .shot { aspect-ratio: 16/9; background: var(--line); display: grid; place-items: center; color: var(--muted); font: 500 .8rem var(--mono); }
.badge .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge .meta { padding: 10px 12px 12px; display: grid; gap: 2px; }
.badge .who { font: 1.1rem var(--display); }
.badge .verdict { font-size: .9rem; color: var(--muted); }
.badge .verdict b { color: var(--ink); font-weight: 600; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
button.ghost { font: 500 .8rem var(--mono); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { all: unset; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; display: grid; background: var(--bg); position: relative; }
.card:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }
.card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--line); }
.card .cap { padding: 8px 10px 10px; display: grid; gap: 1px; }
.card .nm { font-weight: 600; }
.card .job { font-size: .75rem; color: var(--muted); line-height: 1.3; }
.card .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.card .bar i { display: block; height: 100%; background: var(--accent); }
.card .n { position: absolute; top: 6px; right: 6px; background: var(--panel); color: var(--ink); font: 500 .75rem var(--mono); padding: 2px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.card.mine { border-color: var(--hit); box-shadow: 0 0 0 3px var(--hit); }
.card.mine::after { content: "Ton vote"; position: absolute; top: 6px; left: 6px; background: var(--hit); color: #1b2430; font: 500 .7rem var(--mono); padding: 2px 7px; border-radius: 99px; }
@media (max-width: 480px) { h1 { font-size: 1.8rem } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Casting entre collègues</div>
    <h1>Qui est qui ?</h1>
    <p>Choisis une série ou une saga, puis un collègue, et vote pour le personnage qui lui ressemble le plus. Un vote par collègue et par licence ; tu peux changer d'avis quand tu veux.</p>
  </header>

  <section>
    <div class="step"><span class="num">1</span><h2>La licence</h2></div>
    <div class="licences" id="licences"></div>
  </section>

  <section>
    <div class="panel-head">
      <div class="step"><span class="num">2</span><h2>Le collègue</h2></div>
      <span class="status" id="status">Chargement des votes…</span>
    </div>
    <div class="roster" id="roster"></div>
  </section>

  <section class="panel" id="panel" hidden>
    <div class="panel-head">
      <div class="step"><span class="num">3</span><h2 id="panelTitle"></h2></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="status" id="panelCount"></span>
        <button class="ghost" id="clearVote" type="button" hidden>Retirer mon vote</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const API = "https://office-casting.pn6ygnm8s2.workers.dev";
const gifUrl = id => `https://i.giphy.com/media/${id}/200w.gif`;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

// Anonymous per-browser voter id
let voter;
try { voter = localStorage.getItem("voter") || crypto.randomUUID(); localStorage.setItem("voter", voter); }
catch { voter = crypto.randomUUID(); }

let catalog = { people: [], licences: [] }, chars = {};
let tallies = {}, mine = {};
let licence = null, selected = null;

const tallyFor = (person) => tallies[person]?.[licence] || {};

function render() {
  const lic = catalog.licences.find(l => l.id === licence);

  const licBox = $("licences"); licBox.replaceChildren();
  for (const l of catalog.licences) {
    const b = el("button", "lic"); b.type = "button"; b.setAttribute("aria-pressed", String(l.id === licence));
    const img = el("img"); img.src = gifUrl(l.characters[0].giphy); img.alt = "";
    const txt = el("span", null, l.name); txt.append(el("br"), el("small", null, plural(l.characters.length, "personnage")));
    b.append(img, txt);
    b.onclick = () => { location.hash = l.id; };
    licBox.append(b);
  }

  const roster = $("roster"); roster.replaceChildren();
  for (const p of catalog.people) {
    const t = tallyFor(p.id), total = Object.values(t).reduce((a, b) => a + b, 0);
    const top = Object.entries(t).sort((a, b) => b[1] - a[1])[0];
    const c = top && chars[licence][top[0]];
    const b = el("button", "badge"); b.type = "button"; b.setAttribute("aria-pressed", String(p.id === selected));
    const shot = el("div", "shot");
    if (c) { const img = el("img"); img.src = gifUrl(c.giphy); img.alt = c.name; shot.append(img); }
    else shot.textContent = "Pas encore de vote";
    const meta = el("div", "meta"); meta.append(el("div", "who", p.name));
    const v = el("div", "verdict");
    if (c) v.append("C'est ", el("b", null, c.name), ` · ${Math.round(top[1] / total * 100)} % de ${plural(total, "vote")}`);
    else v.textContent = lic ? `Vote pour lancer le casting ${lic.name}` : "";
    meta.append(v); b.append(shot, meta);
    b.onclick = () => { selected = selected === p.id ? null : p.id; render(); };
    roster.append(b);
  }

  const p = catalog.people.find(x => x.id === selected);
  $("panel").hidden = !p || !lic;
  if (!p || !lic) return;
  const t = tallyFor(p.id), total = Object.values(t).reduce((a, b) => a + b, 0);
  const myPick = mine[p.id]?.[licence];
  $("panelTitle").textContent = `Dans ${lic.name}, ${p.name} c'est…`;
  $("panelCount").textContent = plural(total, "vote");
  $("clearVote").hidden = !myPick;
  const grid = $("grid"); grid.replaceChildren();
  const max = Math.max(1, ...Object.values(t));
  for (const c of lic.characters) {
    const n = t[c.id] || 0;
    const card = el("button", "card" + (myPick === c.id ? " mine" : "")); card.type = "button";
    card.setAttribute("aria-label", `${c.name} (${plural(n, "vote")})`);
    const img = el("img"); img.src = gifUrl(c.giphy); img.alt = ""; img.loading = "lazy";
    const cap = el("div", "cap"); cap.append(el("span", "nm", c.name), el("span", "job", c.role));
    const bar = el("div", "bar"), fill = el("i"); fill.style.width = (n / max * 100) + "%"; bar.append(fill); cap.append(bar);
    card.append(img, cap);
    if (n) card.append(el("span", "n", n));
    card.onclick = () => vote(p.id, c.id);
    grid.append(card);
  }
}

function pickLicenceFromHash() {
  const h = location.hash.slice(1);
  licence = catalog.licences.some(l => l.id === h) ? h : catalog.licences[0]?.id;
  render();
}
addEventListener("hashchange", pickLicenceFromHash);

async function load() {
  try {
    const r = await fetch(`${API}/votes?voter=${voter}`);
    if (!r.ok) throw 0;
    ({ tally: tallies, mine } = await r.json());
    $("status").textContent = "Clique sur un collègue pour voter";
  } catch { $("status").textContent = "Impossible de charger les votes."; }
  render();
}

async function vote(person, character) {
  try {
    const r = await fetch(`${API}/vote`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ voter, person, licence, character }) });
    if (!r.ok) throw 0;
  } catch { $("status").textContent = "Vote non enregistré, réessaie."; return; }
  load();
}
$("clearVote").onclick = () => vote(selected, null);

(async () => {
  catalog = await (await fetch("catalog.json")).json();
  chars = Object.fromEntries(catalog.licences.map(l => [l.id, Object.fromEntries(l.characters.map(c => [c.id, c]))]));
  if (catalog.people.length === 1) selected = catalog.people[0].id;
  pickLicenceFromHash();
  load();
})();
addEventListener("focus", load);
</script>
</body>
</html>
